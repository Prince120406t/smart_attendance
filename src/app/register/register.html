<div class="page-container">
    <div class="glass-panel">
        
        <!-- Left Side: Register Form -->
        <div class="form-section">
            <h2>Create Account</h2>
            
            <form class="login-form" (submit)="onRegister($event)">
                <div class="input-pill">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </div>
                    <input type="text" id="reg-username" placeholder="Username" required>
                </div>

                <div class="input-pill">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                        </svg>
                    </div>
                    <input type="email" id="reg-email" placeholder="Email Address" required>
                </div>
                
                <div class="input-pill">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                    </div>
                    <input type="password" id="reg-password" placeholder="Password" required>
                </div>

                <div class="action-buttons">
                    <button type="submit" class="btn btn-login">SIGN UP</button>
                    <button type="button" class="btn btn-register" routerLink="/login">BACK TO LOGIN</button>
                </div>
            </form>
        </div>

        <!-- Right Side: Face ID setup -->
        <div class="face-id-section" (click)="onFaceScan()" style="cursor: pointer;">
            <div class="face-icon-wrapper">
                <svg viewBox="0 0 100 100" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
                    <!-- Brackets -->
                    <path class="scan-bracket" d="M30 25 H20 V35" stroke-width="3"/>
                    <path class="scan-bracket" d="M70 25 H80 V35" stroke-width="3"/>
                    <path class="scan-bracket" d="M30 75 H20 V65" stroke-width="3"/>
                    <path class="scan-bracket" d="M70 75 H80 V65" stroke-width="3"/>
                    
                    <!-- Plus sign in middle for adding face -->
                    <line x1="50" y1="40" x2="50" y2="60" stroke-width="4"/>
                    <line x1="40" y1="50" x2="60" y2="50" stroke-width="4"/>
                </svg>
                <div class="scan-laser"></div>
            </div>
            <h3>{{ faceStatus }}</h3>
            <p style="color: white; text-align: center; font-size: 0.8rem; margin-top: 10px; padding: 0 1rem; opacity: 0.9;">cameras to scan and verify employee faces </p>
        </div>

    </div>
</div>
