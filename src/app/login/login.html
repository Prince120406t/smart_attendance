<section class="page-container">
    <div class="glass-panel">

        <!-- Left Side: Login Form -->
        <div class="form-section">
            <h2>Account</h2>

            <form class="login-form" (submit)="onSubmit($event)">
                <div class="input-pill">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                        </svg>
                    </div>
                    <input type="text" id="username" placeholder="username" required>
                </div>

                <div class="input-pill">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
                        </svg>
                    </div>
                    <input type="password" id="password" placeholder="password" required>
                </div>

                <div class="remember-row">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>

                <div class="action-buttons">
                    <button type="submit" class="btn btn-login">LOGIN</button>
                    <button type="button" class="btn btn-register" routerLink="/register">REGISTER</button>
                </div>
            </form>
        </div>

        <!-- Right Side: Face ID -->
        <div class="face-id-section" (click)="onFaceScan()" style="cursor: pointer;">
            <div class="face-icon-wrapper">
                <svg viewBox="0 0 100 100" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
                    <!-- Brackets -->
                    <path class="scan-bracket" d="M30 25 H20 V35" stroke-width="3" />
                    <path class="scan-bracket" d="M70 25 H80 V35" stroke-width="3" />
                    <path class="scan-bracket" d="M30 75 H20 V65" stroke-width="3" />
                    <path class="scan-bracket" d="M70 75 H80 V65" stroke-width="3" />

                    <!-- Eyes -->
                    <line x1="42" y1="42" x2="42" y2="52" stroke-width="5" stroke-linecap="round" />
                    <line x1="58" y1="42" x2="58" y2="52" stroke-width="5" stroke-linecap="round" />

                    <!-- Smile -->
                    <path d="M40 60 Q 50 70 60 60" fill="none" stroke-width="3" />

                    <!-- Dashed line at bottom -->
                    <line x1="44" y1="75" x2="46" y2="75" stroke-width="2" />
                    <line x1="49" y1="75" x2="51" y2="75" stroke-width="2" />
                    <line x1="54" y1="75" x2="56" y2="75" stroke-width="2" />
                </svg>
                <div class="scan-laser"></div>
            </div>
            <h3>{{ faceStatus }}</h3>
        </div>

    </div>
</section>
